name: Release

# Tag a commit as v0.1.0 to get installers for all three platforms attached to a draft
# release. Nothing is signed yet: Windows will warn about an unknown publisher and macOS will
# refuse to open the app without right-click → Open. Authenticode and Apple notarisation both
# need certificates in secrets, and neither changes any code, so they are deliberately left
# until the app is otherwise finished.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  installers:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSI, NSIS)
            os: windows-latest
            args: ""
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux (AppImage, deb)
            os: ubuntu-22.04
            args: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The macOS runners are Apple silicon, so the Intel build is a cross-compile.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}

      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Wardrobe Studio ${{ github.ref_name }}
          releaseBody: |
            Desktop builds of Wardrobe Studio.

            These are unsigned. Windows shows a SmartScreen warning; on macOS, right-click the
            app and choose Open the first time.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
